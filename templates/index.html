<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynasty GM — Trade Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Trade Builder</h1>
    <div class="opponent-picker">
      <label for="opponent-select">Trade partner</label>
      <select id="opponent-select"></select>
    </div>
  </header>

  <main>
    <section class="panels">
      <div class="panel" id="my-panel">
        <h2 id="my-team-name">My Roster</h2>
        <div class="roster-list" id="my-roster-list"></div>
      </div>
      <div class="panel" id="their-panel">
        <h2 id="their-team-name">Their Roster</h2>
        <div class="roster-list" id="their-roster-list"></div>
      </div>
    </section>

    <section class="find-bar">
      <button id="find-trades-btn">Find Trades</button>
      <span class="hint">Check any players/picks above to seed a deal around them — mine, theirs, or both. Leave everything unchecked to see top packages with no constraints.</span>
    </section>

    <section id="packages"></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
